plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iptv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.iptv.app"
        minSdk 24
        targetSdk 34
        versionCode 165
        versionName "10.80"

        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    // Google Cast SDK
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    // Ponte .await() para Task<> do Firebase, usada em SyncManager.kt e PairingManager.kt
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.1'

    // ExoPlayer (Video Player Integrado)
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.0'

    // Glide (Imagens)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    // Sistema Anti-Bloqueio (OkHttp + DoH)
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0")
    implementation("androidx.media3:media3-datasource-okhttp:1.2.0")

    // StreamVPN — túnel WireGuard (biblioteca oficial, Apache 2.0)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // UI Premium
    implementation("androidx.cardview:cardview:1.0.0")

    // Firebase (sincronização de favoritos/continuar-a-ver E emparelhamento
    // TV<->telemóvel entre dispositivos da mesma conta — substitui os
    // servidores próprios antigos, que deixaram de existir). BOM garante
    // versões compatíveis entre si.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore-ktx'

}

// Tem de vir depois do bloco "dependencies": lê google-services.json e gera
// a configuração de ligação ao projeto Firebase (iptv-app-sync).
apply plugin: 'com.google.gms.google-services'
